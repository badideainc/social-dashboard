AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  social-dashboard

  Sample SAM Template for social-dashboard

Globals:
  Function:
    Timeout: 3

    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Resources:
  GetBoardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: getBoard.handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Events:
        GetBoard:
          Type: Api
          Properties:
            Path: /getBoard
            Method: get

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: "true"
Outputs:
  GetBoardApi:
    Description: API Gateway endpoint URL for Prod stage for Hello World
      function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/getBoard/"
  GetBoardFunction:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt GetBoardFunction.Arn
  GetBoardFunctionIamRole:
    Description: Implicit IAM Role created for Hello World function
    Value: !GetAtt GetBoardFunctionRole.Arn
